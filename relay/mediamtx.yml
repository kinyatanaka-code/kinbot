# kinbot ライブ中継の設定
logLevel: info
readTimeout: 20s
writeTimeout: 20s

# RTMPだけ使う（他は止めて軽くする）
rtmp: yes
rtmpAddress: :1935
rtmpEncryption: "no"
rtsp: no
hls: no
webrtc: no
srt: no
api: no
metrics: no

pathDefaults:
  # 配信が始まったら、宛先をkinbotに聞いてCloudflareへ送り直す
  runOnReady: /app/on-ready.sh $MTX_PATH
  runOnReadyRestart: yes

paths:
  all_others:
