# kinbot ライブ中継の設定
logLevel: info
readTimeout: 20s
writeTimeout: 20s

# RTMPだけ使う（他は止めて軽くする）
rtmp: yes
rtmpAddress: :1935
rtmpEncryption: "no"
rtsp: no
hls: no
webrtc: no
srt: no
api: no
metrics: no

pathDefaults:
  # 誰でも送れる／見られる（合図の文字列そのものが鍵になっている）
  source: publisher

  # 配信が始まったら、宛先をkinbotに聞いてCloudflareへ送り直す
  runOnReady: /app/on-ready.sh $MTX_PATH
  runOnReadyRestart: yes

paths:
  # どんな合図（パス）でも受け取る。「live/kbxxxx」のように2段でも受ける。
  all_others:
