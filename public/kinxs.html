<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kinXs 更新管理</title>
    <link rel="icon" href="/kinxs.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="/kinxs.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0d5b47" />
    <meta name="apple-mobile-web-app-title" content="kinbot" />
    <link rel="stylesheet" href="style.css?v=20261023e" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css" />
    
<style>
  .kx-app{display:flex;min-height:100vh;background:#F3F6F4;}
  .kx-side{flex:none;width:244px;background:#0B3B2E;color:#DCEBE4;padding:20px 14px;display:flex;flex-direction:column;gap:4px;box-sizing:border-box;position:sticky;top:0;height:100vh;}
  .kx-brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px;color:#fff;text-decoration:none;font-weight:800;font-size:19px;letter-spacing:.01em;}
  .kx-brand img{border-radius:11px;}
  .kx-nav{display:flex;align-items:center;gap:10px;padding:11px 12px;white-space:nowrap;border-radius:10px;color:#DCEBE4;text-decoration:none;font-size:14px;}
  .kx-nav.on{background:rgba(182,226,92,.16);color:#fff;font-weight:700;box-shadow:inset 3px 0 0 #B6E25C;}
  .kx-nav.off{opacity:.55;cursor:default;} .kx-nav em{margin-left:auto;font-style:normal;font-size:10.5px;border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:0 6px;}
  .kx-nav:not(.off):hover{background:rgba(255,255,255,.08);}
  .kx-back{margin-top:auto;}
  .kx-main{flex:1;min-width:0;padding:26px 30px 40px;box-sizing:border-box;}
  @media (max-width:860px){ .kx-app{flex-direction:column;} .kx-side{width:auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;} .kx-back{margin-top:0;margin-left:auto;} .kx-brand{padding:2px 8px;} }

  .kx-wrap{display:flex;flex-direction:column;gap:14px;padding:4px 0 40px;}
  .kx-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .kx-logo{width:38px;height:38px;border-radius:11px;background:#0E6B4E;display:flex;align-items:center;justify-content:center;flex:none;}
  .kx-title{font-size:21px;font-weight:800;margin:0;}
  .kx-sub{font-size:12.5px;color:#4F6158;}
  .kx-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;}
  .kx-kpi{background:#fff;border:1px solid #E1E9E5;border-radius:14px;padding:13px 16px;}
  .kx-kpi .l{font-size:12px;font-weight:700;color:#4F6158;} .kx-kpi .v{font-size:26px;font-weight:800;margin-top:2px;} .kx-kpi .s{font-size:11.5px;color:#4F6158;}
  .kx-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .kx-bar input,.kx-bar select{height:36px;border:1px solid #D5E2DB;border-radius:9px;padding:0 10px;font:inherit;font-size:13px;background:#fff;}
  .kx-btn{height:36px;padding:0 13px;border-radius:9px;border:1px solid #D5E2DB;background:#fff;font:inherit;font-size:12.5px;font-weight:700;color:#0D5B47;cursor:pointer;}
  .kx-btn:hover{border-color:#1D9E75;background:#F2FAF6;}
  .kx-tablebox{background:#fff;border:1px solid #E1E9E5;border-radius:16px;overflow-x:auto;}
  .kx-grid{display:grid;grid-template-columns:118px repeat(6,minmax(150px,1fr));min-width:1100px;}
  .kx-h{padding:10px 12px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;background:#F8FAF9;border-bottom:1px solid #E8EEEB;position:sticky;top:0;}
  .kx-rank{display:inline-flex;width:24px;height:24px;border-radius:7px;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex:none;}
  .r-S{background:#0E6B4E;color:#fff;} .r-A{background:#178A66;color:#fff;} .r-B{background:#FFF1DC;color:#7A3F00;} .r-C{background:#FBE4E4;color:#8C1F1F;} .r-Z{background:#EEF1F5;color:#33445E;} .r-F{background:#3A3F3D;color:#fff;}
  .kx-m{padding:12px 14px;border-bottom:1px solid #F0F3F1;border-right:1px solid #F0F3F1;}
  .kx-m b{font-size:15px;font-variant-numeric:tabular-nums;} .kx-m .d{font-size:11.5px;margin-top:2px;color:#4F6158;}
  .kx-m.warn{background:#FFFCF6;} .kx-m.warn .d{color:#7A3300;font-weight:700;} .kx-m.past{background:#FDF3F2;} .kx-m.past .d{color:#8C1F1F;font-weight:700;}
  .kx-c{padding:9px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid #F0F3F1;border-right:1px solid #F5F7F6;}
  .kx-c.hot{background:#FFF4E2;}
  .kx-co{display:block;text-align:left;border-radius:9px;padding:7px 9px;font:inherit;font-size:12px;font-weight:700;color:#1F2A26;background:#fff;border:1px solid #DDE7E2;cursor:pointer;width:100%;}
  .kx-co:hover{border-color:#1D9E75;}
  .kx-co.warn{box-shadow:0 0 0 2px #F0C27A;} .kx-co small{display:block;font-size:11px;font-weight:500;color:#4F6158;margin-top:1px;}
  .kx-co .est{color:#7A3F00;}
  .kx-note{font-size:11.5px;color:#4F6158;}
  .kx-empty{padding:40px;text-align:center;color:#4F6158;font-size:13px;}
  .kx-drawer-bg{position:fixed;inset:0;background:rgba(15,30,25,.32);z-index:50;display:flex;justify-content:flex-end;}
  .kx-drawer{width:min(440px,100%);height:100%;background:#fff;box-shadow:-12px 0 30px -18px rgba(0,0,0,.4);padding:20px 20px 28px;overflow:auto;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;}
  .kx-drawer h2{margin:0;font-size:18px;} .kx-sec{border:1px solid #E8ECEA;border-radius:12px;padding:12px 14px;}
  .kx-sec .lb{font-size:11.5px;font-weight:700;color:#4F6158;margin-bottom:6px;}
  .kx-ranks{display:flex;gap:6px;flex-wrap:wrap;}
  .kx-ranks button{min-width:44px;height:44px;border-radius:10px;border:1px solid #D5E2DB;background:#fff;font:inherit;font-weight:800;font-size:14px;cursor:pointer;}
  .kx-ranks button.on{outline:3px solid #1D9E75;outline-offset:1px;}
  .kx-kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px 10px;font-size:13px;} .kx-kv span:nth-child(odd){color:#4F6158;font-size:12px;}
  .kx-hist{font-size:12px;color:#4F6158;display:flex;flex-direction:column;gap:4px;}
  @media (max-width:760px){ .kx-kpis{grid-template-columns:repeat(2,minmax(0,1fr));} }
  .kx-alert-box{background:#fff;border:1px solid #F0D5B0;border-radius:16px;padding:14px 16px;}
  .kx-alert-box h2{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px;}
  .kx-alerts{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px;}
  .kx-al{border:1px solid #E8ECEA;border-radius:12px;padding:11px 13px;display:flex;flex-direction:column;gap:6px;background:#FCFDFC;}
  .kx-al .n{font-weight:800;font-size:14px;cursor:pointer;color:#1F2A26;background:none;border:0;padding:0;text-align:left;font:inherit;font-weight:800;}
  .kx-rule{font-size:11.5px;font-weight:700;color:#7A3300;background:#FFF1DC;border-radius:6px;padding:2px 8px;}
  .kx-chips{display:flex;gap:6px;flex-wrap:wrap;}
  .kx-chip{height:32px;padding:0 11px;border-radius:99px;border:1px solid #D5E2DB;background:#fff;font:inherit;font-size:12px;font-weight:700;cursor:pointer;}
  .kx-chip.on{background:#0E6B4E;border-color:#0E6B4E;color:#fff;}
  .ls-grid{display:grid;grid-template-columns:minmax(230px,2.2fr) minmax(150px,1.2fr) 74px minmax(150px,1fr) 86px minmax(110px,.9fr) minmax(130px,1fr) minmax(220px,1.8fr);min-width:1150px;}
  .ls-h{padding:11px 16px;font-size:11.5px;font-weight:700;color:#4F6158;background:#F8FAF9;border-bottom:1px solid #E8EEEB;}
  .ls-r{padding:12px 14px;border-bottom:1px solid #F0F3F1;font-size:13px;cursor:pointer;white-space:nowrap;min-width:0;} .ls-r .co,.ls-r .sub{white-space:normal;}
  .ls-r:hover{background:#F7FBF9;}
  .ls-r .co{font-weight:700;} .ls-r .sub{font-size:11.5px;color:#4F6158;margin-top:2px;}
  .kx-lab{font-size:12px;font-weight:700;border-radius:7px;padding:3px 9px;white-space:nowrap;display:inline-block;}
  .l-計上予定{background:#EEF1F5;color:#33445E;} .l-フォローMTG設定中{background:#FFF1DC;color:#7A3F00;} .l-フォローMTG設定済{background:#E6EEFB;color:#1B4789;}
  .l-オンボーディング中{background:#F0EAFB;color:#523490;} .l-利用中{background:#E1F5EE;color:#0A5440;} .l-更新検討時期{background:#FFE9D6;color:#7A3300;}
  .l-解約予定{background:#FBE4E4;color:#8C1F1F;} .l-解約済み{background:#3A3F3D;color:#fff;} .l-キャンセル{background:#EEF1F5;color:#555;} .l-エラー{background:#fff;color:#A51F16;border:1.5px solid #E89A94;}
  .ok-t{color:#0A5440;} .ng-t{color:#8C1F1F;font-weight:700;} .mid-t{color:#7A3F00;}
  .kx-tl{display:flex;flex-direction:column;gap:10px;}
  .kx-tl .it{border-left:3px solid #DDE7E2;padding:2px 0 2px 10px;}
  .kx-tl .it.mtg{border-color:#1D9E75;} .kx-tl .it.touch{border-color:#3F72C9;}
  .kx-tl .t{font-size:12.5px;font-weight:700;} .kx-tl .m{font-size:11.5px;color:#4F6158;} .kx-tl .b{font-size:12.5px;line-height:1.6;margin-top:2px;white-space:pre-line;}
  .kx-in{width:100%;box-sizing:border-box;border:1px solid #D5E2DB;border-radius:9px;padding:8px 10px;font:inherit;font-size:13px;}
  .kx-tog{display:flex;gap:6px;flex-wrap:wrap;} .kx-tog button{border:1px solid #D5E2DB;background:#fff;border-radius:8px;padding:6px 10px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;} .kx-tog button.on{background:#0E6B4E;color:#fff;border-color:#0E6B4E;}
  .kx-tabs{display:flex;gap:6px;} .kx-tabs button{border:0;background:#EEF3F0;border-radius:8px;padding:7px 12px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;color:#33463E;} .kx-tabs button.on{background:#0E6B4E;color:#fff;}
  .kx-ranks button.r-S{background:#0E6B4E;color:#fff;border-color:#0E6B4E;} .kx-ranks button.r-A{background:#178A66;color:#fff;border-color:#178A66;}
  .kx-ranks button.r-B{background:#FFF1DC;color:#7A3F00;} .kx-ranks button.r-C{background:#FBE4E4;color:#8C1F1F;}
  .kx-ranks button.r-Z{background:#EEF1F5;color:#33445E;} .kx-ranks button.r-F{background:#3A3F3D;color:#fff;border-color:#3A3F3D;}
</style>
</head>
  <body>
    <div class="kx-app">
      <nav class="kx-side" aria-label="kinXsのメニュー">
        <a class="kx-brand" href="/kinxs"><img src="/kinxs.svg" alt="" width="40" height="40" /><span>kinXs</span></a>
        <a class="kx-nav" data-view="renew" href="/kinxs?p=renew"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>更新管理</a>
        <a class="kx-nav" data-view="list" href="/kinxs?p=list"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>ユーザー一覧</a>
        <span class="kx-nav off" title="準備中"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="11" rx="1.5"/><rect x="17" y="4" width="4" height="7" rx="1.5"/></svg>ラベル別ボード<em>準備中</em></span>
        <span class="kx-nav off" title="準備中"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 4h10l4 4v12H5z"/><path d="M9 12h6M9 16h4"/></svg>未紐づけ議事録<em>準備中</em></span>
        <a class="kx-nav kx-back" href="/home.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>kinbotへ戻る</a>
      </nav>

      <div class="kx-main">
        <main>
          <div class="kx-wrap" id="vList" hidden>
            <div class="kx-head">
              <div><h1 class="kx-title">ユーザー一覧</h1><div class="kx-sub">SFで申込書回収（06）になった会社が自動で入ります。要注意企業は上にまとめ、表も急ぎの順に並べます</div></div>
            </div>
            <section class="kx-alert-box" id="lsAlerts"></section>
            <div class="kx-bar">
              <input type="search" id="lsQ" placeholder="企業名・担当で探す" style="min-width:220px" />
              <div class="kx-chips" id="lsChips"></div>
              <select id="lsCs" aria-label="CS担当"><option value="">CS担当：全員</option></select>
              <span class="kx-note" id="lsSt" style="margin-left:auto"></span>
            </div>
            <div class="kx-tablebox"><div id="lsTable"><div class="kx-empty">読み込み中…</div></div></div>
          </div>
          <div class="kx-wrap" id="vRenew">
            <div class="kx-head">
              
              <div><h1 class="kx-title">更新管理</h1><div class="kx-sub">更新月＝契約終了日の前月。更新月まで<span id="kxDays">90</span>日以内で確度がB以下の会社は、オレンジの枠で目立たせます</div></div>
              <div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap">
                <button type="button" class="kx-btn" id="kxSync">SFから取り込み直す</button>
              </div>
            </div>
            <div class="kx-kpis" id="kxKpis"></div>
            <div class="kx-bar">
              <input type="search" id="kxQ" placeholder="企業名で探す" style="min-width:220px" />
              <select id="kxCs" aria-label="CS担当"><option value="">CS担当：全員</option></select>
              <label class="kx-note"><input type="checkbox" id="kxPast" /> 更新月を過ぎた会社も出す</label>
              <span class="kx-note" id="kxSt" style="margin-left:auto"></span>
            </div>
            <div class="kx-tablebox"><div id="kxTable"><div class="kx-empty">読み込み中…</div></div></div>
            <p class="kx-note" id="kxFoot"></p>
          </div>
        </main>
      </div>
    </div>
    <script src="kinxs.js?v=20261023e"></script>
  </body>
</html>
