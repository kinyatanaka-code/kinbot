<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kinbot ログイン</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0d5b47" />
    <meta name="apple-mobile-web-app-title" content="kinbot" />
    <link rel="stylesheet" href="style.css?v=20261120i" />
  </head>
  <body>
    <div class="login-wrap">
      <div class="login-card">
        <img class="auth-mascot" src="kinbot.svg" alt="kinbot" />
        <div class="login-brand"><span class="brand-mark"></span> kinbot</div>
        <p class="login-sub">ログイン</p>
        <label class="field"><span>メールアドレス</span><input id="email" type="email" autocomplete="email" /></label>
        <label class="field"><span>パスワード</span><input id="p" type="password" autocomplete="current-password" /></label>
        <button type="button" id="showPw" aria-pressed="false" style="display:inline-flex;align-items:center;gap:6px;margin:-4px 0 12px;padding:4px 8px;border:1px solid #5DCAA5;border-radius:999px;background:#fff;color:#0d5b47;font:inherit;font-size:12px;cursor:pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1d9e75" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span>パスワードを表示</span></button>
        <button class="btn" id="loginBtn">ログイン</button>
        <p class="login-err" id="err" hidden></p>
        <p class="login-alt">アカウントがない方は <a href="register.html">新規登録</a></p>
        <p class="login-alt" style="margin-top:6px">パスワードを忘れた・知らない方は <a href="reset.html">パスワードの再発行</a></p>
      </div>
    </div>
    <script>
      const $ = (id) => document.getElementById(id);
      const IDS = ["p"];
      async function login() {
        $("err").hidden = true;
        try {
          const res = await fetch("/api/login", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ email: $("email").value.trim(), password: $("p").value }),
          });
          if (!res.ok) {
            const d = await res.json().catch(() => ({}));
            throw new Error(d.error || "ログインに失敗しました");
          }
          const next = new URLSearchParams(location.search).get("next");
          location.href = next ? decodeURIComponent(next) : "/";
        } catch (e) {
          $("err").textContent = e.message;
          $("err").hidden = false;
        }
      }
      $("loginBtn").addEventListener("click", login);
      $("p").addEventListener("keydown", (e) => { if (e.key === "Enter") login(); });
      // 入れたパスワードを目で確かめられるように（「2つのパスワードが違います」の原因＝全角などに気づけるように）
      $("showPw").addEventListener("click", () => {
        const show = $("showPw").getAttribute("aria-pressed") !== "true";
        IDS.forEach((id) => { $(id).type = show ? "text" : "password"; });
        $("showPw").setAttribute("aria-pressed", String(show));
        $("showPw").querySelector("span").textContent = show ? "パスワードを隠す" : "パスワードを表示";
      });
    </script>
  </body>
</html>
