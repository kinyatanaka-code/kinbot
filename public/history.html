  </head>
  <body>
    <div class="app">
      <nav class="sidebar">
        <div class="side-brand"><span class="brand-mark"></span><span>kinbot</span></div>
        <a class="side-item" href="home.html"><span class="side-ico ico-home"></span><span class="side-label">ホーム</span></a>
        <a class="side-item" href="index.html"><span class="side-ico ico-rec"></span><span class="side-label">レコーディング</span></a>
        <a class="side-item active" href="history.html"><span class="side-ico ico-hist"></span><span class="side-label">商談履歴</span></a>
        <div class="side-wrap"><a class="side-item" href="apo.html"><span class="side-ico ico-apo"></span><span class="side-label">アポ履歴</span><span class="side-arrow">›</span></a>
          <div class="side-sub">
            <div class="side-sub-head">アポ履歴</div>
            <a class="side-sub-item" href="apo.html?tab=list">アポ一覧</a>
            <a class="side-sub-item" href="report.html?panel=interns">インターンアポ</a>
            <a class="side-sub-item" href="apo.html?tab=rot">割り振り設定</a>
            <a class="side-sub-item" href="apo.html?tab=team">チーム実績</a>
            <a class="side-sub-item" href="apo.html?tab=mail">メール設定</a>
          </div></div>
        <a class="side-item" href="docs.html"><span class="side-ico ico-doc"></span><span class="side-label">資料トラッキング</span></a>
        <div class="side-sep"></div>
        <div class="side-wrap"><a class="side-item side-app" href="/kincall">
          <img class="side-app-ico" src="/kincall.svg" alt="" /><span class="side-label">kincall</span></a></div>
        <div class="side-wrap"><a class="side-item side-app" href="sf-launch.html">
          <span class="side-ico ico-deal"></span><span class="side-label">Salesforce</span></a></div>
        <div class="side-wrap"><a class="side-item side-app" href="ai.html">
          <span class="side-ico ico-rec"></span><span class="side-label">AI社員</span></a></div>
        <div class="side-wrap"><a class="side-item side-app" href="report.html">
          <span class="side-ico ico-ana"></span><span class="side-label">その他ツール</span></a></div>
        <div class="side-foot"><a href="settings.html" class="side-set" title="設定">設定</a><span id="who" class="who"></span><a href="#" id="logout" class="side-logout">ログアウト</a></div>
      </nav>

      <div class="main">
        <header class="topbar topbar-hist">
          <div class="brand"><img class="topbar-bot" src="kinbot.svg" alt="" /><span class="brand-name">商談履歴</span></div>
          <div class="hist-cat-tabs" id="histCatTabs">
            <button class="hist-cat-tab active" data-cat="sales"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="vertical-align:-2px;margin-right:4px"><rect x="1" y="6" width="4" height="9" rx="1" fill="#0d5b47"/><rect x="6" y="3" width="4" height="12" rx="1" fill="#1d9e75"/><rect x="11" y="1" width="4" height="14" rx="1" fill="#5DCAA5"/></svg>商談</button>
            <button class="hist-cat-tab" data-cat="follow"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="vertical-align:-2px;margin-right:4px"><circle cx="8" cy="5" r="3.5" fill="#0d5b47"/><path d="M2 14c0-3.3 2.7-6 6-6s6 2.7 6 6" stroke="#0d5b47" stroke-width="1.5" fill="none"/><path d="M11 4l2 2 3-4" stroke="#1d9e75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>ユーザーフォロー</button>
            <button class="hist-cat-tab" data-cat="internal"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="vertical-align:-2px;margin-right:4px"><rect x="3" y="4" width="10" height="11" rx="1.5" fill="#0d5b47"/><rect x="5" y="1" width="6" height="4" rx="1" fill="#1d9e75"/><rect x="5.5" y="7" width="5" height="1" rx=".5" fill="#fff"/><rect x="5.5" y="9.5" width="5" height="1" rx=".5" fill="#fff"/><rect x="5.5" y="12" width="3" height="1" rx=".5" fill="#fff"/></svg>社内MTG</button>
          </div>
        </header>
        <div class="hfilters" id="hfilters" hidden>
          <label>営業担当<select id="fOwner"><option value="">全員</option></select></label>
          <label class="hsearch">商談名<input type="search" id="fName" placeholder="会社名・担当者名で検索" autocomplete="off" /></label>
          <label class="hdate">商談日<input type="date" id="fDateFrom" /></label>
          <span class="hdate-sep">〜</span>
          <label class="hdate"><input type="date" id="fDateTo" /></label>
          <button class="btn ghost hsearch-clear" id="fClear" type="button">クリア</button>
          <div class="hfilter-actions">
            <button class="btn ghost" id="importRecBtn" title="録音はできているのに履歴に出ていない商談を、Recallの録音から取り込みます（直近2日ぶん）">録音から取り込む</button>
            <button class="btn ghost" id="dlTranscriptBtn" title="いま選んでいる営業担当・商談日で、文字起こしをCSVに落とします（1行＝1発言）">文字起こしをCSVで落とす</button>
            <button class="btn" id="bulkNotionBtn">絞り込みをNotionに一括送信</button>
            <span class="bulk-status" id="bulkNotionStatus"></span>
          </div>
        </div>
        <div id="importRecLog" hidden></div>
        <main class="history">
          <aside class="hlist" id="hlist"><div class="empty-state">読み込み中…</div></aside>
          <section class="hdetail" id="hdetail">
            <div class="empty-state empty-bot"><img src="kinbot.svg" alt="kinbot" /><div>左の一覧から商談を選ぶと、録画・文字起こし・要約・分析を表示します。</div></div>
          </section>
        </main>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <script src="product.js?v=20260912q"></script>
    <script src="temperature.js?v=20260912q"></script>
    <script src="history.js?v=20260912q"></script>
      <script src="nav.js?v=20260912q"></script>
    <script src="/cmdk.js?v=20260827a"></script>
</body>
</html>
