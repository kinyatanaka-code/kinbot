<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kinbot AI社員</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0d5b47" />
    <meta name="apple-mobile-web-app-title" content="kinbot" />
    <link rel="stylesheet" href="style.css?v=20260906g" />
    <style>
      /* 1画面に収めるダッシュボード。ページ自体はスクロールせず、長いリストはカード内で送る。 */
      .ai-page{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:12px;
        padding:14px 16px;overflow:hidden;max-width:1120px;width:100%;margin:0 auto;}
      .ai-hero{flex:0 0 auto;display:flex;gap:16px;align-items:center;
        background:linear-gradient(135deg,#0d5b47,#1d9e75);border-radius:16px;padding:14px 18px;color:#fff;
        box-shadow:0 5px 20px rgba(13,91,71,.16);}
      .ai-hero{flex:0 0 auto;display:flex;gap:16px;align-items:center;
        background:linear-gradient(135deg,#0d5b47,#1d9e75);border-radius:16px;padding:12px 18px;color:#fff;
        box-shadow:0 5px 20px rgba(13,91,71,.16);}
      .ai-ava{flex:0 0 auto;width:150px;height:104px;background:rgba(255,255,255,.12);border-radius:16px;
        display:flex;align-items:center;justify-content:center;overflow:visible;}
      .ai-ava svg{width:140px;height:98px;overflow:visible;}
      /* SVGの部品ごとの初期状態 */
      .kt-head{transform-box:fill-box;transform-origin:50% 96%;}
      .kt-eye-shut{display:none;}
      .kt-zzz{opacity:0;}
      .kt-steam{opacity:0;}
      /* 稼働中：キーを打つように頭がつつく＋体が軽く弾む。画面が光り、湯気が立つ。 */
      .ai-ava.working svg{animation:kt-bob 1.7s ease-in-out infinite;}
      .ai-ava.working .kt-head{animation:kt-peck 1.7s ease-in-out infinite;}
      .ai-ava.working .kt-screen{animation:kt-screen 2.4s ease-in-out infinite;transform-box:fill-box;}
      .ai-ava.working .kt-steam{animation:kt-steam 2.6s ease-in-out infinite;}
      .ceo-ava.working svg{animation:kt-bob 1.7s ease-in-out infinite;}
      .ceo-ava.working .kt-head{animation:kt-peck 1.7s ease-in-out infinite;}
      .ceo-ava.working .kt-screen{animation:kt-screen 2.4s ease-in-out infinite;transform-box:fill-box;}
      .ceo-ava.working .kt-steam{animation:kt-steam 2.6s ease-in-out infinite;}
      .ceo-ava.sleeping .kt-eye-open{display:none;}
      .ceo-ava.sleeping .kt-eye-shut{display:block;}
      @keyframes kt-peck{0%,52%,100%{transform:rotate(0)}60%{transform:rotate(13deg)}68%{transform:rotate(0)}76%{transform:rotate(13deg)}84%{transform:rotate(0)}}
      @keyframes kt-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
      @keyframes kt-screen{0%,100%{opacity:.75}50%{opacity:1}}
      @keyframes kt-steam{0%{opacity:0;transform:translateY(2px)}35%{opacity:.85}100%{opacity:0;transform:translateY(-6px)}}
      /* 休止中：目を閉じ、頭を机へ傾け、Zzzが浮かぶ。ゆっくり呼吸。 */
      .ai-ava.sleeping .kt-eye-open{display:none;}
      .ai-ava.sleeping .kt-eye-shut{display:block;}
      .ai-ava.sleeping .kt-head{transform:rotate(12deg);}
      .ai-ava.sleeping .kt-body{animation:kt-breathe 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%;}
      .ai-ava.sleeping .kt-zzz{animation:kt-zzz 3.6s ease-in-out infinite;}
      @keyframes kt-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
      @keyframes kt-zzz{0%{opacity:0;transform:translateY(2px)}30%{opacity:.9}100%{opacity:0;transform:translateY(-7px)}}
      @media (prefers-reduced-motion: reduce){
        .ai-ava.working svg,.ai-ava.working .kt-head,.ai-ava.working .kt-screen,.ai-ava.working .kt-steam,
        .ai-ava.sleeping .kt-body,.ai-ava.sleeping .kt-zzz{animation:none;}
      }
      /* 発言の吹き出し（キツツキが左から話しかけている感じ） */
      .ai-bubble{position:relative;display:inline-block;max-width:100%;margin-top:6px;
        background:#ffffff;color:#20302b;border-radius:12px;padding:7px 12px;font-size:12.5px;line-height:1.4;
        box-shadow:0 2px 8px rgba(0,0,0,.10);animation:kt-pop .28s ease-out;}
      .ai-bubble::before{content:"";position:absolute;left:-7px;top:12px;width:0;height:0;
        border:6px solid transparent;border-right-color:#ffffff;border-left:0;}
      .ai-bubble #aiBubbleText{transition:opacity .22s ease;display:inline-block;}
      @keyframes kt-pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
      .ai-id{flex:1 1 auto;min-width:0;}
      .ai-name-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
      .ai-name{font-size:22px;font-weight:800;letter-spacing:.02em;}
      .ai-rename{background:rgba(255,255,255,.18);border:0;color:#fff;font-size:12px;border-radius:999px;padding:4px 12px;cursor:pointer;}
      .ai-rename:hover{background:rgba(255,255,255,.28);}
      .ai-say{font-size:12.5px;opacity:.95;margin-top:4px;line-height:1.5;}
      .ai-live{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.16);border-radius:999px;
        padding:4px 11px;font-size:12px;font-weight:700;flex:0 0 auto;}
      .ai-dot{width:9px;height:9px;border-radius:50%;background:#bdf5df;box-shadow:0 0 0 0 rgba(189,245,223,.7);animation:aipulse 2s infinite;}
      .ai-dot.off{background:#e3b7b7;animation:none;box-shadow:none;}
      @keyframes aipulse{0%{box-shadow:0 0 0 0 rgba(189,245,223,.7);}70%{box-shadow:0 0 0 8px rgba(189,245,223,0);}100%{box-shadow:0 0 0 0 rgba(189,245,223,0);}}
      .ai-grid{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr auto;gap:12px;}
      .ai-mem{grid-column:1 / -1;max-height:132px;}
      .ai-mem ul{list-style:none;margin:0;padding:0;}
      .ai-mem li{font-size:12px;color:#33463f;padding:4px 0;border-bottom:1px solid #f0f4f2;line-height:1.5;}
      .ai-mem li:last-child{border-bottom:0;}
      .ai-card{background:#fff;border:1px solid #e6ede9;border-radius:14px;padding:12px 15px;overflow:auto;min-height:0;display:flex;flex-direction:column;}
      .ai-card h3{margin:0 0 9px;font-size:13px;color:#0d5b47;font-weight:800;flex:0 0 auto;}
      .ai-ctl{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px dashed #eef2f0;}
      .ai-ctl:last-of-type{border-bottom:0;}
      .ai-ctl-t{font-size:13px;color:#20302b;}
      .ai-ctl-d{font-size:11px;color:#7d8c86;margin-top:2px;}
      .ai-sw{position:relative;width:44px;height:25px;flex:0 0 auto;border:0;border-radius:999px;background:#d7ded9;cursor:pointer;transition:background .18s;}
      .ai-sw.on{background:#1d9e75;}
      .ai-sw::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:left .18s;}
      .ai-sw.on::after{left:22px;}
      /* ===== 新レイアウト ===== */
      .ai-head-ctl{margin-left:auto;display:flex;gap:18px;align-items:center;flex:0 0 auto;}
      .ai-master{display:flex;flex-direction:column;align-items:center;gap:5px;}
      .ai-master-t{font-size:12px;color:#0d5b47;font-weight:800;}
      .ai-master-s{font-size:11px;color:#1d9e75;font-weight:700;}
      .ai-master-s.off{color:#9aa39d;}
      .ai-sw.big{width:60px;height:32px;}
      .ai-sw.big::after{width:26px;height:26px;}
      .ai-sw.big.on::after{left:31px;}
      .ai-time{display:flex;flex-direction:column;gap:6px;}
      .ai-time-t{font-size:11px;color:#7d8c86;}
      .ai-apply{display:flex;align-items:center;gap:8px;font-size:11px;color:#7d8c86;margin-top:2px;}
      .ai-ctlmsg{flex:0 0 auto;font-size:12px;color:#1d9e75;min-height:16px;margin-top:-4px;}
      .ai-cols{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
      .ai-cols-sub{flex:0 0 auto;min-height:0;}
      .ai-col{background:#fff;border:1px solid #e6ede9;border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;min-height:0;overflow:auto;}
      .ai-col h3{margin:0 0 10px;font-size:14px;color:#0d5b47;font-weight:800;flex:0 0 auto;}
      .ai-cnt{font-size:12px;color:#7d8c86;font-weight:700;margin-left:4px;}
      .ai-subh{font-size:12px;color:#0d5b47;font-weight:800;margin:2px 0 6px;border-left:3px solid #1d9e75;padding-left:7px;}
      .ai-tasks{list-style:none;margin:0 0 4px;padding:0;display:flex;flex-direction:column;gap:6px;}
      .ai-task{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:#20302b;line-height:1.4;}
      .ai-task-k{flex:0 0 auto;font-size:10px;font-weight:700;color:#0d5b47;background:#e8f5ef;border-radius:6px;padding:2px 6px;margin-top:1px;}
      .ai-k-bug{background:#fdecea;color:#c0392b;} .ai-k-error{background:#fdecea;color:#c0392b;}
      .ai-k-idea{background:#eef;color:#5b5be0;} .ai-k-request{background:#e8f5ef;color:#0d5b47;}
      .ai-task-t{flex:1 1 auto;min-width:0;}
      /* 依頼チャット */
      .ai-chatcol{background:#f7fbf9;}
      .ai-chat{flex:1 1 auto;min-height:120px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:2px;}
      .ai-msg{max-width:88%;padding:8px 11px;border-radius:12px;font-size:12.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word;}
      .ai-msg.ai{align-self:flex-start;background:#fff;border:1px solid #e6ede9;color:#20302b;}
      .ai-msg.me{align-self:flex-end;background:#1d9e75;color:#fff;}
      .ai-chat-input{flex:0 0 auto;display:flex;gap:8px;margin-top:10px;}
      .ai-chat-input input{flex:1 1 auto;min-width:0;border:1px solid #d7ded9;border-radius:10px;padding:9px 12px;font-size:13px;}
      .ai-send{flex:0 0 auto;border:0;background:#0d5b47;color:#fff;border-radius:10px;padding:0 16px;font-size:13px;font-weight:700;cursor:pointer;}
      .ai-send:hover{background:#0a4a3a;}
      @media (max-width: 1000px){ .ai-cols{grid-template-columns:1fr;} .ai-head-ctl{flex-wrap:wrap;} }
      .ai-page{overflow:auto;}
      /* ===== 新デザイン：CEOカード＋部門カード ===== */
      .ceo-card{position:relative;display:flex;gap:18px;align-items:stretch;
        background:linear-gradient(120deg,#0d5b47 0%,#1d9e75 100%);
        border-radius:20px;padding:18px 20px;margin-bottom:14px;overflow:hidden;color:#fff;}
      .ceo-card::after{content:"";position:absolute;right:-40px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08);}
      .ceo-ava{flex:0 0 auto;width:150px;height:120px;background:rgba(255,255,255,.14);border-radius:16px;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;}
      .ceo-ava svg{width:140px;height:104px;overflow:visible;}
      .ceo-main{flex:1;min-width:0;position:relative;z-index:1;}
      .ceo-top{display:flex;align-items:center;gap:10px;}
      .ceo-name{font-size:20px;font-weight:800;}
      .ceo-badge{font-size:12px;font-weight:700;background:rgba(255,255,255,.2);border-radius:8px;padding:2px 9px;}
      .ai-rename{margin-left:auto;background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer;}
      .ai-rename:hover{background:rgba(255,255,255,.26);}
      .ceo-sub{font-size:12.5px;color:rgba(255,255,255,.9);margin:4px 0 10px;}
      .ceo-input{display:flex;gap:8px;align-items:flex-start;}
      .ceo-input input{flex:1;min-width:0;border:0;border-radius:10px;padding:10px 12px;font-size:13px;color:#20302b;}
      .ceo-input textarea{flex:1;min-width:0;border:0;border-radius:10px;padding:10px 12px;font-size:13px;color:#20302b;font-family:inherit;line-height:1.5;resize:none;overflow:auto;max-height:140px;}
      .ceo-input .ai-send{flex:0 0 auto;background:#0a4a3a;color:#fff;border:0;border-radius:10px;padding:0 16px;font-size:13px;font-weight:700;cursor:pointer;}
      .ceo-quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
      .ai-q{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:999px;padding:5px 12px;font-size:12px;cursor:pointer;}
      .ai-q:hover{background:rgba(255,255,255,.28);}
      .ceo-llm{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:12px;color:rgba(255,255,255,.9);}
      .ceo-llm select{border:0;border-radius:8px;padding:4px 8px;font-size:12px;color:#0d5b47;background:rgba(255,255,255,.9);}
      .ai-chat.mini{margin-top:8px;display:flex;flex-direction:column;gap:6px;max-height:150px;overflow:auto;}
      .ai-chat.mini .ai-msg{max-width:90%;padding:7px 11px;border-radius:12px;font-size:12.5px;line-height:1.5;white-space:pre-wrap;}
      .ai-chat.mini .ai-msg.ai{align-self:flex-start;background:rgba(255,255,255,.16);color:#fff;}
      .ai-chat.mini .ai-msg.me{align-self:flex-end;background:#fff;color:#0d5b47;font-weight:600;}
      .ai-ctlmsg{color:#eafff6;font-size:12px;min-height:0;}

      .dept-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
      .dept-card{background:#fff;border:1px solid #e6ede9;border-radius:16px;padding:15px 16px;box-shadow:0 3px 14px rgba(13,91,71,.06);}
      .dept-head{display:flex;align-items:center;gap:10px;}
      .dept-ico{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
      .dept-ico.sup{background:#e6f7ef;color:#0d5b47;}
      .dept-ico.dev{background:#eef2ff;color:#3b3bd6;}
      .dept-name{font-size:15px;font-weight:800;color:#20302b;}
      .dept-badge{margin-left:auto;font-size:12px;font-weight:700;color:#1d9e75;background:#e6f7ef;border-radius:8px;padding:3px 10px;}
      .dept-badge.off{color:#9aa39d;background:#f2f2f2;}
      .dept-desc{font-size:12px;color:#7d8c86;margin:6px 0 10px;}
      .dept-stats{display:flex;gap:10px;margin-bottom:10px;}
      .dept-stat{flex:1;background:#f6faf8;border-radius:12px;padding:10px;text-align:center;}
      .dept-stat b{display:block;font-size:22px;font-weight:800;color:#20302b;}
      .dept-stat span{font-size:11px;color:#7d8c86;}
      .dept-jobs,.dept-more{border-top:1px solid #f0f4f2;padding-top:6px;}
      .ai-jrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;font-size:13px;color:#20302b;}
      .ai-jn{display:flex;flex-direction:column;min-width:0;}
      .ai-jt{font-size:11px;color:#9aa39d;font-weight:400;}
      .ai-st{font-size:11px;font-weight:800;border-radius:6px;padding:2px 8px;}
      .ai-st.on{color:#1d9e75;background:#e6f7ef;}
      .ai-st.off{color:#9aa39d;background:#f2f2f2;}
      .ai-st.always{color:#5b6be0;background:#eef2ff;}
      .dept-btn{width:100%;margin-top:10px;background:#f2f8f5;border:1px solid #dfeae5;color:#0d5b47;border-radius:10px;padding:9px;font-size:13px;font-weight:700;cursor:pointer;}
      .dept-btn:hover{background:#e6f2ec;}
      .dept-actions{margin-top:8px;}
      .dept-mini{width:100%;background:#fff;border:1px solid #dfeae5;color:#0d5b47;border-radius:10px;padding:8px;font-size:12.5px;font-weight:700;cursor:pointer;}
      .dept-mini:hover{background:#f2f8f5;}
      .dept-mini:disabled{opacity:.6;cursor:default;}
      .dev-progress{font-size:12px;color:#7d8c86;margin:8px 0 0;display:flex;align-items:center;gap:6px;min-height:16px;}
      .dev-progress .dot{width:8px;height:8px;border-radius:50%;background:#c7cec9;flex:0 0 auto;}
      .dev-progress.run .dot{background:#1d9e75;animation:blink 1s ease-in-out infinite;}
      .dev-progress.run{color:#0d5b47;}
      .dev-progress.fail .dot{background:#c0392b;} .dev-progress.fail{color:#c0392b;}
      .dev-progress.ok .dot{background:#1d9e75;}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
      .pr-opt{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:#5b7a6d;margin:8px 0 6px;align-items:center;}
      .pr-opt label{display:inline-flex;align-items:center;gap:4px;}
      .pr-list{margin-top:8px;display:flex;flex-direction:column;gap:8px;}
      .pr-dl{display:flex;gap:8px;flex-wrap:wrap;}
      .pr-b{background:#fff;border:1px solid #dfeae5;color:#0d5b47;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;}
      .pr-b:hover{background:#f2f8f5;} .pr-b.done{background:#0d5b47;color:#fff;border-color:#0d5b47;} .pr-b.done:hover{background:#0a4a3a;}
      .pr-item{border:1px solid #eef3f0;border-radius:12px;padding:10px 12px;}
      .pr-h{font-size:13px;font-weight:800;color:#20302b;}
      .pr-badge{font-size:10px;font-weight:700;border-radius:6px;padding:1px 7px;margin-left:6px;}
      .pr-badge.open{color:#1d9e75;background:#e6f7ef;} .pr-badge.merged{color:#5b6be0;background:#eef2ff;}
      .pr-sum{font-size:12px;color:#5b7a6d;margin:4px 0;}
      .pr-files{font-size:11.5px;color:#7d8c86;margin:4px 0;}
      .pr-f span{color:#9aa39d;}
      .pr-ops{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
      .pr-diff{max-height:280px;overflow:auto;background:#0d1f1a;color:#cfe;border-radius:8px;padding:10px;font-size:11px;line-height:1.5;white-space:pre;margin-top:8px;}
      .sf-status{margin-top:4px;}
      .sf-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
      .sf-tile{background:#f6faf8;border-radius:10px;padding:8px;text-align:center;}
      .sf-tile b{display:block;font-size:18px;font-weight:800;color:#20302b;}
      .sf-tile span{font-size:10.5px;color:#7d8c86;}
      .sf-tile.warn{background:#fdf3e7;} .sf-tile.warn b{color:#c0392b;}
      .cr-targets{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0;}
      .cr-t{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:#20302b;background:#f6faf8;border:1px solid #e6ede9;border-radius:8px;padding:4px 9px;cursor:pointer;}
      @media (max-width:520px){ .sf-tiles{grid-template-columns:repeat(2,1fr);} }
      @media (max-width:900px){ .dept-grid{grid-template-columns:1fr;} .ceo-card{flex-direction:column;} .ceo-ava{width:100%;height:120px;} }
      /* 新デザインはビューポート固定をやめ、通常フロー＋スクロールにする（潰れ防止） */
      main.ai-page{display:block;overflow:auto;height:auto;min-height:0;flex:0 1 auto;}
      .ceo-card,.dept-grid,.ai-cols-sub{flex:0 0 auto;}
      /* 組織カタログ（CEO→社内支援AI/開発AI） */
      .ai-org{flex:0 0 auto;background:#fff;border:1px solid #e6ede9;border-radius:14px;padding:12px 14px;margin-bottom:4px;}
      .ai-org-h{font-size:12.5px;color:#0d5b47;font-weight:700;margin-bottom:10px;}
      .ai-org-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
      .ai-dept{border:1px solid #e6ede9;border-radius:12px;padding:10px 12px;background:#fbfefd;}
      .ai-dept-h{display:flex;align-items:center;gap:8px;}
      .ai-dept-name{font-size:14px;font-weight:800;color:#0d5b47;}
      .ai-dept-c{font-size:11px;color:#7d8c86;background:#eef5f1;border-radius:8px;padding:1px 7px;}
      .ai-dept-d{font-size:11px;color:#7d8c86;margin:2px 0 8px;}
      .ai-jobs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;}
      .ai-job{border-top:1px solid #eef3f0;padding-top:7px;}
      .ai-job:first-child{border-top:0;padding-top:0;}
      .ai-job-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
      .ai-job-name{font-size:12.5px;font-weight:700;color:#20302b;}
      .ai-job-trg{font-size:11px;color:#7d8c86;}
      .ai-job-ex{font-size:10.5px;color:#0d5b47;background:#e8f5ef;border-radius:6px;padding:1px 6px;}
