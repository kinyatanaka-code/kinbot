<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0E6B4E" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>kinbot 切り替え</title>
<style>
  :root { --g:#0E6B4E; --g2:#1d9e75; --pale:#EAF4EF; --line:#dfe8e3; --tx:#1f2a26; --sub:#5f6b64; --red:#b3261e; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif; background:#f3f7f5; color:var(--tx);
         padding:calc(12px + env(safe-area-inset-top,0px)) 14px calc(24px + env(safe-area-inset-bottom,0px)); }
  h1 { font-size:18px; margin:4px 0 12px; display:flex; align-items:center; gap:8px; }
  h1 small { font-size:12px; color:var(--sub); font-weight:500; margin-left:auto; }
  .card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:12px; }
  .lb { font-size:12px; color:var(--sub); margin-bottom:6px; }
  .rec { display:flex; align-items:center; gap:8px; font-weight:700; font-size:16px; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--red); animation:b 1.4s infinite; flex:none; }
  @keyframes b { 50% { opacity:.3; } }
  .meta { font-size:12.5px; color:var(--sub); margin-top:4px; }
  .btn { display:block; width:100%; border:0; border-radius:14px; padding:16px; font-size:16px; font-weight:700; margin-top:10px; cursor:pointer; }
  .btn.main { background:var(--g2); color:#fff; }
  .btn.ghost { background:#fff; color:var(--g); border:1.5px solid #cfe0d9; }
  .btn.stop { background:#fff; color:var(--red); border:1.5px solid #f3c2bd; }
  .btn:disabled { opacity:.5; }
  .ev { display:flex; align-items:center; gap:10px; padding:12px; border:1.5px solid var(--line); border-radius:14px; margin-top:8px; background:#fff; cursor:pointer; }
  .ev.sel { border-color:var(--g2); background:var(--pale); }
  .ev .t { font-weight:700; font-size:14.5px; line-height:1.4; }
  .ev .w { font-size:12px; color:var(--sub); white-space:nowrap; }
  .ev .now { font-size:11px; color:#fff; background:var(--g2); border-radius:99px; padding:1px 7px; margin-left:6px; }
  input { width:100%; border:1.5px solid var(--line); border-radius:12px; padding:12px; font-size:15px; font-family:inherit; margin-top:8px; }
  .msg { font-size:13px; margin-top:10px; min-height:18px; }
  .ok { color:var(--g); } .ng { color:var(--red); }
  .empty { font-size:13px; color:var(--sub); }
</style>
</head>
<body>
  <h1>kinbot 切り替え <small id="clock"></small></h1>
  <div class="card" id="nowCard"><div class="lb">いま録音中</div><div class="empty">読み込み中…</div></div>
  <div class="card">
    <div class="lb">次の商談（押して選ぶ）</div>
    <div id="evs"><div class="empty">読み込み中…</div></div>
    <input id="title" placeholder="予定にない商談のときは、商談名を入れる" />
    <button class="btn main" id="go" type="button">次の商談に切り替える</button>
    <div class="msg" id="msg"></div>
  </div>
  <p class="empty" style="padding:0 4px">押すと、いま入っているkinbotが抜けて前の商談の録音が終わり（要約・分析はいつもどおり作られます）、同じZoomの部屋に新しいkinbotが入って次の商談として録音します。</p>
<script>
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v == null ? "" : v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const hm = (iso) => { const d = new Date(iso); return isNaN(d) ? "" : `${d.getHours()}:${String(d.getMinutes()).padStart(2, "0")}`; };
let st = null, sel = null, busy = false;
async function api(url, opts = {}) {
  const r = await fetch(url, { headers: { "content-type": "application/json" }, credentials: "same-origin", ...opts });
  if (r.status === 401 || r.redirected) { location.href = "/login.html?next=" + encodeURIComponent("/switch.html"); throw new Error("ログインしてください"); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || `エラー（${r.status}）`);
  return d;
}
function render() {
  const a = (st && st.active) || [];
  $("nowCard").innerHTML = `<div class="lb">いま録音中</div>` + (a.length ? a.map((x) => `
    <div class="rec"><span class="dot"></span>${esc(x.title || "（商談名なし）")}</div>
    <div class="meta">${esc(hm(x.startedAt))}から ・ ${/waiting_room/.test(x.status) ? "待合室で待っています" : /joining/.test(x.status) ? "入っています…" : "録音中"}</div>
    <button class="btn stop" data-stop="${esc(x.botId)}" type="button">この録音を終える</button>`).join("") : `<div class="empty">いま入っているkinbotはありません。下で商談を選んで押すと、録音を始めます。</div>`);
  $("go").textContent = a.length ? "次の商談に切り替える" : "この商談の録音を始める";
  const evs = (st && st.upcoming) || [];
  const curTitle = a[0] ? a[0].title : "";
  if (sel === null) { const nx = evs.find((e) => e.title !== curTitle && Date.parse(e.start) > Date.now() - 20 * 60000) || evs.find((e) => e.title !== curTitle) || evs[0]; sel = nx ? nx.id : ""; }
  $("evs").innerHTML = evs.length ? evs.map((e) => `<div class="ev ${e.id === sel ? "sel" : ""}" data-id="${esc(e.id)}">
      <div style="flex:1;min-width:0"><div class="t">${esc(e.title)}${e.now ? '<span class="now">いま</span>' : ""}</div></div>
      <div class="w">${esc(hm(e.start))}〜${esc(hm(e.end))}</div></div>`).join("") : `<div class="empty">これからの予定がカレンダーにありません</div>`;
  document.querySelectorAll(".ev").forEach((el) => el.addEventListener("click", () => { sel = el.dataset.id; $("title").value = ""; render(); }));
  document.querySelectorAll("[data-stop]").forEach((b) => b.addEventListener("click", async () => {
    if (!confirm("この録音を終えます。よろしいですか？")) return;
    b.disabled = true;
    try { const r = await api("/api/switch/stop", { method: "POST", body: JSON.stringify({ botId: b.dataset.stop }) }); say(`「${r.left}」の録音を終えました`, true); await load(); }
    catch (e) { say(e.message, false); b.disabled = false; }
  }));
}
function say(t, ok) { const m = $("msg"); m.textContent = t; m.className = "msg " + (ok ? "ok" : "ng"); }
async function load() {
  try { st = await api("/api/switch/state"); render(); }
  catch (e) { say(e.message, false); }
}
$("go").addEventListener("click", async () => {
  if (busy) return;
  const evs = (st && st.upcoming) || [];
  const ev = evs.find((e) => e.id === sel);
  const title = $("title").value.trim() || (ev ? ev.title : "");
  if (!title) { say("商談を選ぶか、商談名を入れてください", false); return; }
  const cur = (st && st.active && st.active[0]) || null;
  if (!confirm(cur ? `「${cur.title}」の録音を終えて、\n「${title}」に切り替えます。` : `「${title}」の録音を始めます。`)) return;
  busy = true; $("go").disabled = true; say("切り替えています…", true);
  try {
    const r = await api("/api/switch/next", { method: "POST", body: JSON.stringify({ botId: cur ? cur.botId : "", title }) });
    say(cur ? `切り替えました。kinbotが「${r.started}」に入ります（30秒ほどかかります）` : `kinbotが「${r.started}」に入ります（30秒ほどかかります）`, true);
    sel = null; $("title").value = "";
    setTimeout(load, 4000);
  } catch (e) { say("失敗：" + e.message, false); }
  finally { busy = false; $("go").disabled = false; }
});
setInterval(() => { $("clock").textContent = hm(new Date().toISOString()); }, 1000);
setInterval(() => { if (!busy) load(); }, 20000);
load();
</script>
</body>
</html>
