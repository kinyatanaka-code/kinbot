<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>リードの状況をそろえる</title>
<!-- SF のリードの状況（Lead.Status）の表記ゆれ（NEW・LS:89　リサイクル・04ジャッジ など）を、基本の7つの表記にまとめて書き換える管理者の画面（2026-11-24 福井さん）。
     開くと下見だけを読み、「そろえる」を押したときだけ SF を書き換える。1件ずつ前の値を残すので、回ごとに元に戻せる -->
<style>
  body { margin: 0; background: #f6f8f7; color: #1f2a27; font: 14px/1.6 system-ui, "Hiragino Sans", "Yu Gothic UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 18px; color: #0d5b47; margin: 4px 0 12px; } h2 { font-size: 15px; color: #0d5b47; margin: 0 0 6px; }
  .card { background: #fff; border: 1px solid #dfe8e4; border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; overflow-x: auto; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .kpi { background: #eef7f3; border-radius: 10px; padding: 6px 12px; } .kpi b { font-size: 18px; color: #0d5b47; }
  button { background: #1d9e75; color: #fff; border: 0; border-radius: 10px; padding: 8px 16px; font-size: 14px; cursor: pointer; }
  button.sub { background: #fff; color: #0d5b47; border: 1px solid #5DCAA5; padding: 4px 10px; font-size: 12px; }
  button:disabled { background: #9bb8ad; color: #fff; border-color: transparent; cursor: default; }
  label.sc { border: 1px solid #dfe8e4; border-radius: 10px; padding: 4px 10px; cursor: pointer; } label.sc:has(input:checked) { border-color: #1d9e75; background: #eef7f3; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; } th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid #eef2f0; vertical-align: top; }
  th { color: #5b6b66; font-weight: 600; } td.n { text-align: right; font-variant-numeric: tabular-nums; }
  .note { color: #5b6b66; font-size: 12px; } .err { color: #b42318; } .to { color: #0d5b47; font-weight: 700; } .stay { color: #b54708; }
  progress { width: 260px; height: 10px; accent-color: #1d9e75; }
</style>
</head>
<body>
<main>
  <h1>リードの状況（SF）を基本の7つの表記にそろえる</h1>
  <div class="card"><h2>基本の7つ</h2><table><thead><tr><th>表記</th><th>意味</th><th>SF の値</th></tr></thead><tbody id="defs"><tr><td colspan="3" class="note">読み込み中…</td></tr></tbody></table></div>
  <div class="card">
    <div class="row">範囲：
      <label class="sc"><input type="radio" name="scope" value="mochica" checked> MOCHICA のリード</label>
      <label class="sc"><input type="radio" name="scope" value="all"> すべてのリード（DOC も含む）</label></div>
    <div class="row" id="kpi" style="margin-top:8px"></div>
    <p class="row"><button id="go" disabled>そろえる</button> <progress id="pg" hidden max="1" value="0"></progress> <span id="msg" class="note" role="status"></span></p>
    <div class="note">コンバート済みのリードは SF が書き換えを断るので対象外です。書き換えた前の値は1件ずつ残すので、下の「これまで」から回ごとに元に戻せます（ほかの人がそのあと変えたリードは戻しません）。</div>
  </div>
  <div class="card"><h2>書き換える値</h2><table><thead><tr><th>今の値</th><th>→ そろえる先</th><th class="n">件数</th><th>レコードタイプ</th></tr></thead><tbody id="tb"></tbody></table></div>
  <div class="card"><h2>これまで</h2><table><thead><tr><th>回</th><th>いつ</th><th>だれ</th><th>範囲</th><th>進み具合</th><th>状態</th><th></th></tr></thead><tbody id="runs"></tbody></table></div>
</main>
<script>
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const $ = (id) => document.getElementById(id);
const scope = () => document.querySelector('input[name="scope"]:checked').value;
const jst = (iso) => iso ? new Date(iso).toLocaleString("ja-JP", { timeZone: "Asia/Tokyo", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "";
const ST = { running: "動いている", done: "終わった", error: "止まった（エラー）", stopped: "止まった（もう一度押すと残りを続ける）" };
async function api(path, opt) {
  const r = await fetch(path, opt); const j = await r.json().catch(() => ({ error: `読めませんでした（${r.status}）` }));
  if (!r.ok || j.error) throw new Error(j.error || `失敗しました（${r.status}）`); return j;
}
let poll = null;
function drawRuns(runs, running) {
  $("runs").innerHTML = (runs || []).map((r) => `<tr><td>${r.id}</td><td>${esc(jst(r.started_at))}</td><td>${esc(r.by_user)}</td><td>${r.scope === "revert" ? esc(r.note) : r.scope === "all" ? "すべて" : "MOCHICA"}</td>
    <td>${r.done} / ${r.total}（書けた ${r.ok}・断られた ${r.ng}）</td><td>${esc(ST[r.state] || r.state)}${r.note && r.scope !== "revert" ? `<div class="err">${esc(r.note)}</div>` : ""}</td>
    <td>${r.scope !== "revert" && r.ok ? `<button class="sub" data-rev="${r.id}" ${running ? "disabled" : ""}>元に戻す</button>` : ""}</td></tr>`).join("") || `<tr><td colspan="7" class="note">まだありません</td></tr>`;
  document.querySelectorAll("[data-rev]").forEach((b) => b.onclick = async () => {
    if (!confirm(`${b.dataset.rev} 回目で書き換えたリードを、前の値に戻します。よろしいですか？`)) return;
    try { await api(`/api/mccall/stage-norm/revert/${b.dataset.rev}`, { method: "POST" }); load(); } catch (e) { $("msg").innerHTML = `<span class="err">${esc(e.message)}</span>`; }
  });
}
async function load() {
  $("msg").textContent = "SF から数えています…"; $("go").disabled = true;
  try {
    const j = await api(`/api/mccall/stage-norm?scope=${scope()}`);
    $("defs").innerHTML = j.stages.map((s) => `<tr><td><b>${esc(s.code)}：${esc(s.name)}</b></td><td>${esc(s.desc)}</td><td>${s.value ? esc(s.value) : '<span class="err">SF の選択リストに無い</span>'}</td></tr>`).join("");
    $("kpi").innerHTML = `<div class="kpi">書き換える <b>${j.move.toLocaleString()}</b> 件</div><div class="kpi">そろえられず残る <b>${j.stay.toLocaleString()}</b> 件</div>`;
    $("tb").innerHTML = j.items.map((x) => `<tr><td>${x.from ? esc(x.from) : "（空）"}</td><td>${x.to ? `<span class="to">${esc(x.to)}</span>` : `<span class="stay">そのまま（${esc(x.why)}）</span>`}</td><td class="n">${x.n.toLocaleString()}</td>
      <td class="note">${Object.entries(x.rts).map(([k, v]) => `${esc(k)} ${v.toLocaleString()}`).join("・")}</td></tr>`).join("") || `<tr><td colspan="4" class="note">表記ゆれはありません。すべて7つの表記です</td></tr>`;
    drawRuns(j.runs, j.running);
    const run = j.running ? j.runs.find((r) => r.id === j.running) : null;
    if (run) { $("pg").hidden = false; $("pg").max = run.total || 1; $("pg").value = run.done; $("msg").textContent = `${run.id} 回目が動いています：${run.done.toLocaleString()} / ${run.total.toLocaleString()} 件`; if (!poll) poll = setInterval(load, 4000); }
    else { if (poll) { clearInterval(poll); poll = null; } $("pg").hidden = true; $("go").disabled = !j.move; $("msg").textContent = j.move ? "下見です。まだ何も書き換えていません" : ""; }
  } catch (e) { $("msg").innerHTML = `<span class="err">${esc(e.message)}</span>`; }
}
document.querySelectorAll('input[name="scope"]').forEach((r) => r.onchange = load);
$("go").onclick = async () => {
  if (!confirm(`${scope() === "all" ? "すべてのリード" : "MOCHICA のリード"}のリードの状況を、7つの表記に書き換えます。よろしいですか？`)) return;
  $("go").disabled = true;
  try { const j = await api("/api/mccall/stage-norm/run", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ scope: scope() }) }); $("msg").textContent = j.nothing ? "書き換えるものはありませんでした" : `始めました（${j.total.toLocaleString()} 件）`; load(); }
  catch (e) { $("msg").innerHTML = `<span class="err">${esc(e.message)}</span>`; $("go").disabled = false; }
};
load();
</script>
</body>
</html>
