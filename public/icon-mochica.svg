<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="kinbot">
  <!--
    アイコン用のkinbot。
    小さく表示されるので、まばたきなどの動きは入れず、輪郭をはっきりさせています。
    背景は角丸の緑。iPhoneのホーム画面でも、ブラウザのタブでも同じ見た目になります。
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d686d"/>
      <stop offset="1" stop-color="#0b595d"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a7ecef"/>
      <stop offset="1" stop-color="#5cc7cc"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a5558"/>
      <stop offset="1" stop-color="#0d3a3d"/>
    </linearGradient>
    <radialGradient id="eye" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#e6feff"/>
      <stop offset="1" stop-color="#7ce9ef"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#72cbcf"/>
      <stop offset="1" stop-color="#43a8ae"/>
    </linearGradient>
  </defs>

  <!-- 背景（角丸の四角） -->
  <rect x="0" y="0" width="240" height="240" rx="52" fill="url(#bg)"/>

  <!-- アンテナ -->
  <line x1="120" y1="62" x2="120" y2="40" stroke="#8ddee2" stroke-width="7" stroke-linecap="round"/>
  <circle cx="120" cy="35" r="10" fill="#b6fcff"/>

  <!-- ヘッドホンのバンド -->
  <path d="M52 138 A70 70 0 0 1 188 138" fill="none" stroke="#8ddee2" stroke-width="12" stroke-linecap="round"/>

  <!-- 天然パーマ -->
  <g fill="url(#hair)">
    <circle cx="72" cy="82" r="18"/>
    <circle cx="96" cy="68" r="20"/>
    <circle cx="120" cy="61" r="21"/>
    <circle cx="144" cy="68" r="20"/>
    <circle cx="168" cy="82" r="18"/>
  </g>

  <!-- 顔 -->
  <rect x="52" y="70" width="136" height="116" rx="38" fill="url(#head)"/>

  <!-- ほっぺ -->
  <ellipse cx="74" cy="150" rx="10" ry="6" fill="#ff9bb0" opacity="0.5"/>
  <ellipse cx="166" cy="150" rx="10" ry="6" fill="#ff9bb0" opacity="0.5"/>

  <!-- バイザー -->
  <rect x="70" y="96" width="100" height="60" rx="28" fill="url(#visor)"/>

  <!-- 眉 -->
  <path d="M86 108 Q101 100 116 107" fill="none" stroke="#bef6f9" stroke-width="9" stroke-linecap="round"/>
  <path d="M124 107 Q139 100 154 108" fill="none" stroke="#bef6f9" stroke-width="9" stroke-linecap="round"/>

  <!-- 目 -->
  <circle cx="101" cy="128" r="16" fill="url(#eye)"/>
  <circle cx="139" cy="128" r="16" fill="url(#eye)"/>

  <!-- 口 -->
  <path d="M105 148 Q120 160 135 148" fill="none" stroke="#7ce9ef" stroke-width="5" stroke-linecap="round"/>

  <!-- 耳あて -->
  <rect x="38" y="116" width="26" height="46" rx="12" fill="#5abcc1"/>
  <rect x="176" y="116" width="26" height="46" rx="12" fill="#5abcc1"/>
  <rect x="43" y="125" width="14" height="28" rx="7" fill="#a7ecef" opacity="0.9"/>
  <rect x="181" y="125" width="14" height="28" rx="7" fill="#a7ecef" opacity="0.9"/>
</svg>
