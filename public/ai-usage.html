<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kinbot AI の使用量</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#0d5b47" />
    <link rel="stylesheet" href="style.css?v=20261125zh" />
    <style>
      /* AI（Gemini）の使用量（2026-11-18 田中さん「機能ごとの使用量数えて欲しい」） */
      .au{max-width:1100px}
      .au-top{display:flex;gap:12px;flex-wrap:wrap;align-items:stretch;margin-bottom:14px}
      .au-kpi{background:#fff;border:1px solid #d7e8e0;border-radius:14px;padding:12px 16px;min-width:150px}
      .au-kpi small{display:block;font-size:11.5px;color:#5b6b66}
      .au-kpi b{display:block;font-size:22px;color:#0d5b47;line-height:1.3}
      .au-kpi em{font-style:normal;font-size:11.5px;color:#5b6b66}
      .au-days{margin-left:auto;display:flex;gap:4px;align-self:center}
      .au-days button{border:1px solid #cfe6dc;background:#fff;color:#0d5b47;border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer}
      .au-days button.on{background:#1d9e75;color:#fff;border-color:#1d9e75}
      .au-sec{background:#fff;border:1px solid #d7e8e0;border-radius:16px;padding:14px 16px;margin-bottom:14px}
      .au-sec h3{margin:0 0 10px;font-size:14px;color:#0d5b47}
      .au-row{display:grid;grid-template-columns:minmax(0,1fr) 90px 110px;gap:10px;align-items:center;padding:8px 4px;border-top:1px solid #f0f5f3;font-size:13px}
      .au-row:first-of-type{border-top:0}
      .au-row .nm b{display:block;color:#1f2d29;font-weight:600}
      .au-row .nm small{color:#5b6b66;font-size:11.5px}
      .au-row .bar{height:5px;border-radius:3px;background:#5DCAA5;margin-top:5px}
      .au-row .n{text-align:right;color:#5b6b66;font-size:12px}
      .au-row .y{text-align:right;font-weight:700;color:#0d5b47}
      .au-tag{display:inline-block;font-size:10.5px;border-radius:999px;padding:0 7px;margin-left:6px;vertical-align:1px}
      .au-tag.audio{background:#fff4e6;color:#9a5a12}.au-tag.search{background:#eaf2ff;color:#2453a6}.au-tag.err{background:#fde9e7;color:#b3261e}
      .au-chart{display:flex;align-items:flex-end;gap:3px;height:120px;padding-top:6px}
      .au-chart div{flex:1;background:#5DCAA5;border-radius:4px 4px 0 0;min-height:2px;position:relative}
      .au-chart div:hover{background:#1d9e75}
      .au-axis{display:flex;justify-content:space-between;font-size:11px;color:#8a9893;margin-top:4px}
      .au-note{font-size:12px;color:#5b6b66;line-height:1.7}
    </style>
  </head>
  <body>
    <div class="app">
      <nav class="sidebar">
        <div class="side-brand"><span class="brand-mark"></span><span>kinbot</span></div>
        <div class="side-foot"><span id="who" class="who"></span><a href="#" id="logout" class="side-logout">ログアウト</a></div>
      </nav>
      <div class="main">
        <header class="topbar"><div class="brand"><img class="topbar-bot" src="kinbot.svg" alt="" /><span class="brand-name">AI の使用量</span></div></header>
        <main class="report-page"><div class="au" id="au">読み込んでいます…</div></main>
      </div>
    </div>
    <script src="ai-usage.js?v=20261125zh"></script>
    <script src="nav.js?v=20261125zh"></script>
  </body>
</html>
