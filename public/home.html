<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kinbot ホーム</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0d5b47" />
    <meta name="apple-mobile-web-app-title" content="kinbot" />
    <link rel="stylesheet" href="style.css?v=20260818e" />
  </head>
  <body>
    <div class="app">
      <nav class="sidebar">
        <div class="side-brand"><span class="brand-mark"></span><span>kinbot</span></div>
        <a class="side-item active" href="home.html"><span class="side-ico ico-home"></span><span class="side-label">ホーム</span></a>
        <a class="side-item" href="index.html"><span class="side-ico ico-rec"></span><span class="side-label">レコーディング</span></a>
        <a class="side-item" href="history.html"><span class="side-ico ico-hist"></span><span class="side-label">商談履歴</span></a>
        <a class="side-item" href="sf-launch.html"><span class="side-ico ico-deal"></span><span class="side-label">Salesforce</span></a>
        <a class="side-item" href="report.html"><span class="side-ico ico-ana"></span><span class="side-label">分析</span></a>
        <a class="side-item" href="report.html?panel=interns"><span class="side-ico ico-apo"></span><span class="side-label">インターンアポ</span></a>
        <a class="side-item" href="apo.html"><span class="side-ico ico-assign"></span><span class="side-label">アポ振り分け</span></a>
        <a class="side-item" href="docs.html"><span class="side-ico ico-doc"></span><span class="side-label">資料トラッキング</span></a>
        <a class="side-item" href="settings.html"><span class="side-ico ico-set"></span><span class="side-label">設定</span></a>
        <div class="side-foot"><span id="who" class="who"></span><a href="#" id="logout" class="side-logout">ログアウト</a></div>
      </nav>

      <div class="main">
        <header class="topbar">
          <div class="brand"><img class="topbar-bot" src="kinbot.svg" alt="" /><span class="brand-name">ホーム</span></div>
        </header>
        <div class="home-wrap">
          <div class="home-head">
            <div class="home-title" id="homeDate">今日の商談</div>
            <div class="home-head-right">
              <div class="home-week-nav">
                <button class="home-week-arrow" id="weekPrev" type="button" aria-label="前の週">
                  <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M15 5.5 8.5 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <div class="home-week" id="homeWeek"></div>
                <button class="home-week-arrow" id="weekNext" type="button" aria-label="次の週">
                  <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M9 5.5 15.5 12 9 18.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
              </div>
              <div class="home-datenav">
                <button class="home-dbtn" id="datePrev" type="button" title="前の日">
                  <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M15 5.5 8.5 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <label class="home-dinput">
                  <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M3.5 9.5h17M8 3.5v3M16 3.5v3" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
                  <input type="date" id="datePick" />
                </label>
                <button class="home-dbtn" id="dateNext" type="button" title="次の日">
                  <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M9 5.5 15.5 12 9 18.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <button class="home-dtoday" id="dateToday" type="button">今日</button>
              </div>
              <div class="home-toggle" id="homeToggle">
                <button class="home-tg active" data-scope="mine" type="button">自分</button>
                <button class="home-tg" data-scope="all" type="button">全員</button>
              </div>
            </div>
          </div>
          <div class="home-body">
            <div class="home-main">
              <!-- 会社名で探す。商談履歴まで行かずに、ここから開ける。 -->
              <div class="home-find">
                <svg viewBox="0 0 24 24" class="hf-ico" aria-hidden="true"><path d="M10 3a7 7 0 1 1-4.9 12L2 18.1 3.9 20l3.1-3.1A7 7 0 0 1 10 3zm0 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"/></svg>
                <input type="text" id="hfQ" placeholder="会社名・営業担当で探す（例：ベルク、田中）" autocomplete="off" />
                <button type="button" class="hf-clear" id="hfClear" hidden aria-label="消す">×</button>
                <div class="hf-list" id="hfList" hidden></div>
              </div>

              <!-- よく使うツール。押すとその画面へ移る。人ごとに選べる。 -->
              <div class="home-tools" id="homeTools" hidden></div>

              <!-- し忘れを防ぐための帯。押すとその件だけに絞り込む。 -->
              <div class="todo-bar" id="todoBar" hidden></div>

              <!-- 明日リマインドを送る先。送る前に、宛先や日時を確かめられる。 -->
              <div class="rm-bar" id="rmBar" hidden></div>
              <div class="home-cols">
                <section class="home-sec home-pane">
                  <div class="home-sec-head">
                    <span class="home-sec-title">今日の商談</span>
                    <span class="home-sec-count" id="homeMtgCount"></span>
                  </div>
                  <div class="home-pane-body" id="homeList"><div class="home-empty">読み込み中…</div></div>
                </section>
                <section class="home-sec home-pane" id="homeApoSec">
                  <div class="home-sec-head">
                    <span class="home-sec-title">自分のアポ</span><span class="home-sec-note">この日に取ったぶん</span>
                    <span class="home-sec-count" id="homeApoCount"></span>
                    <a class="home-sec-link" href="apo.html">一覧へ</a>
                  </div>
                  <div class="home-pane-body" id="homeApoList"></div>
                </section>
              </div>
            </div>
            <aside class="home-side">
              <div class="home-panel home-panel-mini">
                <div class="home-panel-h">
                  <button type="button" class="home-mini-arrow" id="miniPrev" aria-label="前の月">
                    <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M15 5.5 8.5 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  </button>
                  <span id="miniLabel">7月</span>
                  <button type="button" class="home-mini-arrow" id="miniNext" aria-label="次の月">
                    <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M9 5.5 15.5 12 9 18.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  </button>
                </div>
                <div class="home-mini" id="homeMini"></div>
              </div>
              <div class="home-panel">
                <div class="home-panel-h">
                  <span>温度感ランキング</span>
                  <div class="home-rank-tabs">
                    <button type="button" class="home-rank-tab active" data-by="deal">商談</button>
                    <button type="button" class="home-rank-tab" data-by="member">メンバー</button>
                  </div>
                </div>
                <div class="home-rank-rounds">
                  <button type="button" class="home-rank-round active" data-rank="score">温度感</button>
                  <button type="button" class="home-rank-round" data-rank="swing">振れ幅</button>
                  <button type="button" class="home-rank-round" data-rank="skill">進め方</button>
                </div>
                <div class="home-rank-rounds">
                  <button type="button" class="home-rank-round active" data-round="">全部</button>
                  <button type="button" class="home-rank-round" data-round="1">1回目</button>
                  <button type="button" class="home-rank-round" data-round="2">2回目</button>
                  <button type="button" class="home-rank-round" data-round="3plus">3回目〜</button>
                </div>
                <div id="homeRank"><div class="home-panel-empty">読み込み中…</div></div>
              </div>
            </aside>
          </div>
        </div>
      </div>
    </div>
    <script src="home.js?v=20260818e"></script>
    <script src="nav.js?v=20260818e"></script>
  </body>
</html>
