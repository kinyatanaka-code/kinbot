<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>かささぎ</title>
<style>
  /* 会議の映像として配信されるページ。1920x1080で読まれる想定。 */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #06231c; }
  body {
    font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
    color: #0b2b23; display: flex; align-items: center; justify-content: center;
  }
  .stage { position: relative; width: 100vw; height: 100vh;
    background: linear-gradient(135deg, #f3fbf8 0%, #eaf6f1 55%, #e2f2ff 100%); }

  /* 中央のスライド */
  .slide { position: absolute; inset: 6vh 7vw 16vh; display: flex; flex-direction: column;
    justify-content: center; gap: 2.4vh; opacity: 0; transform: translateY(1.6vh);
    transition: opacity .45s ease, transform .45s ease; }
  .slide.on { opacity: 1; transform: none; }
  .eyebrow { font-size: 2.1vh; font-weight: 800; letter-spacing: .16em; color: #1d9e75; }
  .headline { font-size: 7.4vh; font-weight: 800; line-height: 1.22; letter-spacing: .01em; }
  .lead { font-size: 3vh; line-height: 1.75; color: #2f5c50; max-width: 62vw; }
  .points { display: flex; flex-direction: column; gap: 1.5vh; margin-top: 1vh; }
  .point { display: flex; align-items: flex-start; gap: 1.4vw; font-size: 2.9vh; line-height: 1.6; }
  .num { flex: none; width: 4.6vh; height: 4.6vh; border-radius: 50%; background: #1d9e75; color: #fff;
    font-size: 2.2vh; font-weight: 800; display: flex; align-items: center; justify-content: center; }

  /* 下の帯：しゃべっている内容の字幕 */
  .bar { position: absolute; left: 0; right: 0; bottom: 0; min-height: 13vh; padding: 2.4vh 7vw 3vh;
    background: rgba(6, 35, 28, .93); color: #eaf6f1; display: flex; align-items: center; gap: 2vw; }
  .face { flex: none; width: 8.4vh; height: 8.4vh; border-radius: 50%; background: #0f6e56;
    display: flex; align-items: center; justify-content: center; position: relative; }
  .face svg { width: 5vh; height: 5vh; }
  .face img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
  .face.has-img { background: transparent; }
  .face.talking::after { content: ""; position: absolute; inset: -0.8vh; border-radius: 50%;
    border: 0.4vh solid #5DCAA5; animation: pulse 1.1s ease-out infinite; }
  @keyframes pulse { 0% { transform: scale(.96); opacity: .9 } 100% { transform: scale(1.14); opacity: 0 } }
  .caption { font-size: 2.9vh; line-height: 1.6; flex: 1; }
  .who { font-size: 1.9vh; color: #9fe1cb; font-weight: 800; letter-spacing: .1em; margin-bottom: .5vh; }
  .idle { color: #9fe1cb; }
</style>
</head>
<body>
  <div class="stage">
    <div class="slide" id="slide"></div>
    <div class="bar">
      <div class="face" id="face">
        <img id="faceImg" alt="" hidden />
        <svg id="faceSvg" viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <rect x="9" y="14" width="30" height="22" rx="9" fill="#eaf6f1"/>
          <circle cx="18.5" cy="25" r="3.4" fill="#0f6e56"/>
          <circle cx="29.5" cy="25" r="3.4" fill="#0f6e56"/>
          <rect x="22" y="7" width="4" height="7" rx="2" fill="#eaf6f1"/>
          <circle cx="24" cy="6" r="2.6" fill="#5DCAA5"/>
        </svg>
      </div>
      <div style="flex:1">
        <div class="who">かささぎ</div>
        <div class="caption idle" id="caption">よろしくお願いいたします。</div>
      </div>
    </div>
  </div>

<script>
(function () {
  const q = new URLSearchParams(location.search);
  const botId = q.get("bot") || "";

  // スライドの中身。資料の実データが用意できるまでは、この文字組みで映す。
  const SLIDES = {
    cover:   { eyebrow: "NEO CAREER", head: "どこでもオープンカンパニー", lead: "採用を、会社を見せるところから。" },
    company: { eyebrow: "会社紹介", head: "株式会社ネオキャリア", lead: "人材領域で20年。採用の入口から定着までを支援しています。" },
    problem: { eyebrow: "採用の課題", head: "母集団は集まる。<br>でも、辞退される。", points: ["応募はあるが、面接前に離脱する", "会社の雰囲気が伝わっていない", "説明に人手と時間がかかる"] },
    service: { eyebrow: "サービス", head: "会社をそのまま見せる", lead: "オフィス・働く人・仕事の様子を、いつでも見てもらえる形にします。" },
    usage:   { eyebrow: "使い方", head: "求人票にURLを1つ足すだけ", points: ["求人媒体・自社サイトに設置", "スマホでもそのまま見られる", "応募前に会社を理解してもらう"] },
    flow:    { eyebrow: "導入の流れ", head: "撮影から公開まで、最短2週間", points: ["ヒアリング（1回・60分）", "撮影（半日）", "公開・運用開始"] },
    case:    { eyebrow: "導入事例", head: "辞退率が下がった例", lead: "面接前の離脱が減り、選考に進む人の理解度が上がったという声をいただいています。" },
    pricing: { eyebrow: "料金", head: "初期費用＋月額", lead: "撮影範囲と拠点数で変わります。詳細はお見積りでご案内します。" },
    faq:     { eyebrow: "よくある質問", head: "お答えします", lead: "" },
    next:    { eyebrow: "次のご案内", head: "まずは御社の状況を<br>お聞かせください", lead: "そのうえで、必要な範囲だけをご提案します。" },
    summary: { eyebrow: "本日のまとめ", head: "承った内容", lead: "" },
  };

  const imgEl = document.getElementById("faceImg");
  const svgEl = document.getElementById("faceSvg");
  const whoEl = document.querySelector(".who");
  let curImg = "";
  const slideEl = document.getElementById("slide");
  const capEl = document.getElementById("caption");
  const faceEl = document.getElementById("face");
  let cur = "", curCap = "";

  function esc(v) {
    return String(v == null ? "" : v).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function draw(key, summary) {
    const d = SLIDES[key] || SLIDES.cover;
    let html = `<div class="eyebrow">${esc(d.eyebrow)}</div>` +
               `<div class="headline">${d.head}</div>`;
    const lead = key === "summary" && summary ? summary : d.lead;
    if (lead) html += `<div class="lead">${esc(lead).replace(/\n/g, "<br>")}</div>`;
    if (d.points) {
      html += '<div class="points">' + d.points.map((p, i) =>
        `<div class="point"><span class="num">${i + 1}</span><span>${esc(p)}</span></div>`).join("") + "</div>";
    }
    slideEl.classList.remove("on");
    setTimeout(() => { slideEl.innerHTML = html; slideEl.classList.add("on"); }, 180);
  }

  async function tick() {
    try {
      const r = await fetch("/api/kasasagi/face?botId=" + encodeURIComponent(botId), { cache: "no-store" });
      const d = await r.json();
      if (d.slide && d.slide !== cur) { cur = d.slide; draw(cur, d.summary); }
      const cap = d.listening ? "お話をうかがっています。" : (d.caption || "よろしくお願いいたします。");
      if (cap !== curCap) { curCap = cap; capEl.textContent = cap; }
      capEl.classList.toggle("idle", !d.caption || !!d.listening);
      faceEl.classList.toggle("talking", !!d.speaking);

      // アバターの画像（設定されていれば差し替える。話しているとき用の絵も指定できる）
      const want = (d.speaking && d.avatarSpeakUrl) ? d.avatarSpeakUrl : (d.avatarUrl || "");
      if (want !== curImg) {
        curImg = want;
        if (want) { imgEl.src = want; imgEl.hidden = false; svgEl.style.display = "none"; faceEl.classList.add("has-img"); }
        else { imgEl.hidden = true; svgEl.style.display = ""; faceEl.classList.remove("has-img"); }
      }
      if (d.name && whoEl.textContent !== d.name) whoEl.textContent = d.name;
      if (d.brand) SLIDES.cover.eyebrow = d.brand;
    } catch {}
  }

  draw("cover");
  tick();
  setInterval(tick, 700);
})();
</script>
</body>
</html>
