# kinbot 1時間ごとの自動改善
#
# 1時間ごとに、kinbotに溜まった「直したいこと」をClaudeが直します。
#   ・小さくて安全な変更 → そのままmainへ（Railwayが自動で反映）
#   ・少しでも引っかかるもの → PRにして、田中さんが見るまで止める
#
# 止めたいときは、kinbotの ツール→開発メモ で「自動で反映する」をOFFにしてください。
# 戻したいときは、Actionsの「巻き戻し」を実行してください。

name: 1時間ごとの自動改善

on:
  schedule:
    - cron: "0 * * * *"      # 毎時0分
  workflow_dispatch:
    inputs:
      max_items:
        description: "今回やる件数"
        required: false
        default: "2"
      force_pr:
        description: "本番に入れず、必ずPRにする（yes/no）"
        required: false
        default: "no"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: kinbot-auto
  cancel-in-progress: false

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: コードを取ってくる
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.jsを用意する
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # kinbot側の「自動で反映する」がONかを見る。OFFなら何もしない。
      # kinbot側の「自動で反映する」がONかを見る。OFFなら何もしない。
      - name: 自動で反映してよいかを確かめる
        id: gate
        env:
          KINBOT_URL: ${{ vars.KINBOT_URL || 'https://kinbot-production-225f.up.railway.app' }}
          KINBOT_TOKEN: ${{ secrets.KINBOT_TOKEN }}
        run: node dev/gate.mjs

      - name: 今回やることを決める
        if: steps.gate.outputs.run == 'true'
        env:
          KINBOT_URL: ${{ vars.KINBOT_URL || 'https://kinbot-production-225f.up.railway.app' }}
          KINBOT_TOKEN: ${{ secrets.KINBOT_TOKEN }}
          MAX_ITEMS: ${{ github.event.inputs.max_items || '2' }}
        run: node dev/night-brief.mjs

      - name: 指示を表示する
        if: steps.gate.outputs.run == 'true'
        run: cat dev/NIGHT_BRIEF.md

      - name: やることが無ければ終わる
        if: steps.gate.outputs.run == 'true'
        id: has
        run: |
          if grep -q "今夜やることはない" dev/NIGHT_BRIEF.md; then
            echo "todo=false" >> $GITHUB_OUTPUT
          else
            echo "todo=true" >> $GITHUB_OUTPUT
          fi

      - name: Claude Code を入れる
        if: steps.has.outputs.todo == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: 直してもらう
        if: steps.has.outputs.todo == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "$(cat <<'EOF'
          あなたはこのリポジトリ（kinbot）の開発者です。
          まず CLAUDE.md を読み、決まりを必ず守ってください。
          次に dev/NIGHT_BRIEF.md を読み、書かれていることを直してください。

          この変更は、確認が通れば人の目を経ずに本番へ入ります。だから:
          - 迷うものには手を付けない。確実に直せるものだけ直す。
          - 変更はできるだけ小さく。関係ない整形はしない。
          - Salesforceの書き込み、カレンダーの削除、全員宛の通知、鍵まわりには触らない。
          - データベースの列を消す変更はしない。
          - 直したら node --check で確かめる。
          - コミットはしない。

          最後に dev/NIGHT_RESULT.md に、日本語でこう書いてください:
          ## 直したもの
          - メモID: 12 / 何を / どのファイル / どう直したか
          ## 手を付けなかったもの
          - メモID: 34 / 理由
          EOF
          )" --permission-mode acceptEdits --allowed-tools "Read,Edit,Write,Bash(node --check *),Bash(ls *),Bash(grep *),Bash(cat *)"

      - name: 触ってはいけない所を戻す
        if: steps.has.outputs.todo == 'true'
        run: |
          git checkout -- package-lock.json 2>/dev/null || true
          git checkout -- .github 2>/dev/null || true

      - name: 文法を確かめる
        if: steps.has.outputs.todo == 'true'
        run: |
          for f in $(git diff --name-only | grep -E '\.(js|mjs)$' || true); do
            echo "確認: $f"; node --check "$f" || exit 1
          done

      - name: 自動で入れてよい変更かを見る
        if: steps.has.outputs.todo == 'true'
        id: guard
        run: |
          node dev/guard.mjs
          echo "ok=$(node -p "require('./dev/GUARD.json').ok")" >> $GITHUB_OUTPUT
          echo "changed=$(node -p "require('./dev/GUARD.json').changed")" >> $GITHUB_OUTPUT

      - name: 実際に動くかを確かめる
        if: steps.guard.outputs.changed == 'true'
        run: |
          npm install --omit=dev --no-audit --no-fund
          node dev/smoke.mjs

      # ここまで全部通ったものだけ、本番へ入れる
      - name: 本番へ入れる
        if: >
          steps.guard.outputs.ok == 'true' &&
          steps.gate.outputs.apply == 'true' &&
          github.event.inputs.force_pr != 'yes'
        id: apply
        run: |
          git config user.name "kinbot"
          git config user.email "kinbot@neo-career.co.jp"
          rm -f dev/GUARD.json dev/NIGHT_BRIEF.md dev/night-ids.json dev/ADVISOR_INPUT.md
          git add -A
          git commit -m "自動改善：開発メモの対応（$(date -u -d '+9 hours' '+%m/%d %H:%M')）"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      # 引っかかったものは、人が見る形にする
      - name: PRにする
        if: >
          steps.guard.outputs.changed == 'true' &&
          (steps.guard.outputs.ok != 'true' || steps.gate.outputs.apply != 'true' ||
           github.event.inputs.force_pr == 'yes')
        uses: peter-evans/create-pull-request@v6
        with:
          branch: auto/hourly-${{ github.run_number }}
          commit-message: "自動改善（確認が必要）"
          title: "🤖 自動改善：確認をお願いします（${{ github.run_number }}）"
          body-path: dev/NIGHT_RESULT.md
          labels: 自動
          delete-branch: true

      - name: 結果をkinbotに知らせる
        if: always() && steps.has.outputs.todo == 'true'
        env:
          KINBOT_URL: ${{ vars.KINBOT_URL || 'https://kinbot-production-225f.up.railway.app' }}
          KINBOT_TOKEN: ${{ secrets.KINBOT_TOKEN }}
          APPLIED_SHA: ${{ steps.apply.outputs.sha }}
        run: node dev/report.mjs applied
